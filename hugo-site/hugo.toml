baseURL = 'https://aalkaswan.github.io'
languageCode = 'en-us'
title = 'Ali Al-Kaswan'
theme = 'hugo-book'

# Configure publishing to docs folder for GitHub Pages
publishDir = '../docs'

[params]
# Book configuration
BookTheme = 'auto'
BookMenuBundle = '/menu'
BookDateFormat = 'January 2, 2006'
BookRepo = 'https://github.com/aalkaswan/aalkaswan.github.io'
BookSearch = false
BookComments = true

[markup]
[markup.goldmark.renderer]
unsafe = true

